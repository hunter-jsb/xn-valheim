name: statuspage

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: statuspage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    if: ${{ vars.REFRESH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The page no longer needs this job at all -- it reads the server live
      # through the Worker. This only keeps the Statuspage components honest.
      - name: Push health to Statuspage
        env:
          WEBMAP_URL: ${{ vars.WEBMAP_URL || 'http://170.23.227.3:27021' }}
          STATUSPAGE_API_KEY: ${{ secrets.STATUSPAGE_API_KEY }}
          STATUSPAGE_PAGE_ID: ${{ secrets.STATUSPAGE_PAGE_ID }}
          STATUSPAGE_SERVER_COMPONENT_ID: ${{ secrets.STATUSPAGE_SERVER_COMPONENT_ID }}
          STATUSPAGE_WEBMAP_COMPONENT_ID: ${{ secrets.STATUSPAGE_WEBMAP_COMPONENT_ID }}
        run: uv run scripts/statuspage_push.py
