# The map site is the mod's own viewer (hunter-jsb/valheim-webmap, WebMap/web).
# This deploys that viewer to our Pages with our site-config.js on top, so there
# is no copy of the site here: a change to the viewer redeploys ours within a
# quarter hour, or at once by hand.
name: site
on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/site.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: valheim-webmap ref to deploy
        default: main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the viewer from the mod
        env:
          REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          # the whole WebMap/web folder at the ref, subfolders and all (the 3D view's js/
          # and its vendored three.js), so a new file in the viewer needs no edit here
          mkdir -p out src
          curl -sfL "https://codeload.github.com/hunter-jsb/valheim-webmap/tar.gz/${REF}" \
            | tar -xz -C src --wildcards '*/WebMap/web/*'
          cp -r src/*/WebMap/web/. out/
          test -f out/index.html
          cp site/site-config.js out/site-config.js
          # crawler-facing text is ours here; the viewer's own is generic
          sed -i 's|<title>Valheim WebMap</title>|<title>Xandaris Valheim</title>|; s|content="Valheim WebMap"|content="Xandaris Valheim"|g' out/*.html
          echo "deployed $(curl -sfL "https://api.github.com/repos/hunter-jsb/valheim-webmap/commits/${REF}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"][:7])')" > out/version.txt
          ls -la out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
