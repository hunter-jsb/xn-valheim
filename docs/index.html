<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xandaris Valheim — Server Status</title>
<meta name="description" content="Live status, metrics, and world map for the Xandaris Valheim dedicated server.">
<meta property="og:title" content="Xandaris Valheim">
<meta property="og:description" content="Live status, metrics, and world map for the Xandaris Valheim server.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪓</text></svg>">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d0f0e;--panel:#15181600;--card:#171b18;--card2:#1d221e;
    --ink:#e7e2d4;--muted:#9aa093;--line:#2a302a;
    --gold:#c9a15a;--gold-dim:#8f7440;--pine:#4a6b4d;--blood:#7c2f2f;
    --ok:#6faf68;--off:#a85757;--unknown:#8a8577;
  }
  body{background:
      radial-gradient(1200px 500px at 50% -10%, #1a201b 0%, transparent 60%),
      var(--bg);
    color:var(--ink);line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:var(--gold)}
  .wrap{max-width:1040px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
  header.hero{text-align:center;margin-bottom:2.5rem}
  .hero h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:.06em;text-transform:uppercase;
    color:var(--gold);text-shadow:0 0 24px rgba(124,47,47,.35)}
  .hero .sub{color:var(--muted);font-style:italic;margin-top:.25rem}
  .ip{display:inline-flex;gap:.6rem;align-items:center;margin-top:1.1rem;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.5rem .9rem}
  .ip code{font-family:"Cascadia Code",Consolas,monospace;color:#fff}
  .ip .btn{background:var(--gold);color:#1a1400;border:none;border-radius:.4rem;
    padding:.25rem .6rem;font-size:.8rem;cursor:pointer}
  .pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .85rem;border-radius:999px;
    font-weight:600;font-size:.9rem;border:1px solid var(--line)}
  .pill .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--unknown)}
  .pill.online{color:var(--ok);border-color:#33502f}.pill.online .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .pill.offline{color:var(--off);border-color:#4a2a2a}.pill.offline .dot{background:var(--off)}
  .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:1.5rem 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem 1.2rem}
  .tile .k{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
  .tile .v{font-size:1.7rem;font-weight:700;margin-top:.2rem;color:#fff}
  .tile .v small{font-size:.9rem;color:var(--muted);font-weight:400}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:.9rem;
    padding:1.4rem 1.4rem 1.2rem;margin-top:1.5rem}
  section.card h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);
    margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
  .chartbox{position:relative;height:230px}
  .maparea{aspect-ratio:16/10;border:1px dashed var(--gold-dim);border-radius:.6rem;
    display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);
    background:repeating-linear-gradient(45deg,#14171400,#141714 12px,#171b18 12px,#171b18 24px);padding:2rem}
  .maparea img{max-width:100%;border-radius:.5rem}
  footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:2.5rem}
  .stamp{color:var(--muted);font-size:.8rem;text-align:center;margin-top:.4rem}
  .err{color:var(--off);font-size:.82rem}
  .maptools{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
  .maptools label{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer}
  .mapwrap{position:relative;width:100%;aspect-ratio:1/1;background:#0a0c0a;border:1px solid var(--line);border-radius:.6rem;overflow:hidden}
  .mapwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
  #mapFog{mix-blend-mode:multiply;opacity:.92}

</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Xandaris Valheim</h1>
    <div class="sub">Tenth world. Deep North ready. Odin is watching.</div>
    <div class="ip" onclick="copyIp()" title="Copy connect address">
      <code id="ipcode">—</code><button class="btn">copy</button>
    </div>
    <div style="margin-top:1rem"><span id="pill" class="pill"><span class="dot"></span><span id="pilltext">Loading…</span></span></div>
  </header>

  <div class="grid" id="tiles"></div>



  <section class="card">
    <h2>🗺️ World Map — Mothership</h2>
    <div class="maptools">
      <label><input type="checkbox" id="fogToggle" checked> Fog of war (explored only)</label>
      <a id="mapFull" href="./data/map/map.png" target="_blank" rel="noopener">Open full size ↗</a>
    </div>
    <div class="mapwrap" id="mapwrap">
      <img id="mapBase" src="./data/map/map.png" alt="Valheim world map">
      <img id="mapFog" src="./data/map/fog.png" alt="explored areas">
    </div>
    <p class="stamp">Rendered live on the server by the WebMap mod, pulled over SFTP.</p>
  </section>

  <p class="stamp" id="stamp"></p>
  <footer>
    State-as-code: <a href="https://github.com/hunter-jsb/xn-valheim">hunter-jsb/xn-valheim</a> ·
    hosted by <a href="https://indifferentbroccoli.com/valheim-server-hosting">indifferent broccoli</a>
  </footer>
</div>

<script>
const GOLD="#c9a15a", PINE="#6faf68", MUTE="#9aa093", GRID="#2a302a";
let CONNECT="";

function copyIp(){ if(CONNECT) navigator.clipboard?.writeText(CONNECT); }

function tile(k,v,sub){ return `<div class="tile"><div class="k">${k}</div><div class="v">${v}${sub?` <small>${sub}</small>`:""}</div></div>`; }

function setPill(online){
  const p=document.getElementById("pill"), t=document.getElementById("pilltext");
  p.className="pill "+(online===true?"online":online===false?"offline":"");
  t.textContent = online===true?"Online":online===false?"Offline":"Status unknown";
}

async function load(){
  let s={};
  try{ s = await (await fetch("./data/status.json?"+Date.now())).json(); }
  catch(e){ document.getElementById("stamp").innerHTML='<span class="err">No status.json yet — the collector has not run.</span>'; return; }

  CONNECT = s.ip ? `${s.ip}:${s.port||s.game_port||""}`.replace(/:$/,"") : (s.linuxUsername||"—");
  document.getElementById("ipcode").textContent = CONNECT || "—";
  setPill(s.online);

  const tiles=[
    tile("Players", (s.players??"—")+"", s.max_players?`/ ${s.max_players}`:""),
    tile("World", s.map||s.world||"—"),
    tile("Version", s.version||"1.0"),
    tile("Ping", s.ping_ms!=null?s.ping_ms:"—", s.ping_ms!=null?"ms":""),
  ];
  document.getElementById("tiles").innerHTML = tiles.join("");

  const when = s.checked_at ? new Date(s.checked_at).toLocaleString() : "—";
  document.getElementById("stamp").textContent =
    `Last checked ${when} · source: ${s.source||"—"}` + (s.panel_error?` · panel: ${s.panel_error}`:"");

}


const fogT=document.getElementById("fogToggle");
if(fogT){ fogT.addEventListener("change",()=>{ document.getElementById("mapFog").hidden=!fogT.checked; }); }

load();
</script>
</body>
</html>
